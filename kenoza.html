<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>مغامرات كنوزة</title>
<meta name="theme-color" content="#FF6FA5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="مغامرات كنوزة">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#4A3428;--ink-soft:#8A705B;--line:#F2DCE8;--paper:#FFF7F9;--pink:#FF6FA5;--pink-d:#E04E86;--lilac:#A78BDB;--lilac-d:#8B66C7;--aqua:#3EC1CF;--gold:#FFC531;--gold-d:#E8A61E;--leaf:#7CC24E;--leaf-d:#5CA23A}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{font-family:'Baloo Bhaijaan 2',sans-serif;color:var(--ink);background:#F9D3E4;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer}
#app{position:fixed;top:0;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--paper);overflow:hidden}
.screen{position:absolute;top:0;left:0;right:0;bottom:0;display:none;flex-direction:column;overflow:hidden}
.screen.on{display:flex;animation:scrIn .3s ease}
@keyframes scrIn{from{opacity:0;transform:scale(1.02)}to{opacity:1;transform:none}}
svg{display:block}
.logo-box svg{width:100%;height:100%}
.world .disc .art svg{width:100%;height:100%}
.big-animal svg,.feed-an svg,.letter-card .mini svg{width:100%;height:auto}
.lolo svg{width:100%;height:auto}
.g-item svg{width:100%;height:auto}
.sess-count svg{width:100%;height:100%}
.level-card .st svg{width:100%;height:100%}
.sndfx{position:absolute;top:5%;left:50%;transform:translateX(-50%);background:#fff;border:3px solid var(--gold);border-radius:20px;padding:8px 26px;font-size:28px;font-weight:800;color:var(--ink);box-shadow:0 5px 0 var(--gold-d);z-index:9;white-space:nowrap;animation:sfxPop .45s cubic-bezier(.34,1.56,.64,1)}
@keyframes sfxPop{from{transform:translateX(-50%) scale(.4);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border-radius:999px;font-weight:800;color:#fff;padding:16px 34px;font-size:22px;box-shadow:0 6px 0 rgba(0,0,0,.16);transition:transform .08s}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 rgba(0,0,0,.16)}
.btn-pink{background:var(--pink)}.btn-lilac{background:var(--lilac)}.btn-leaf{background:var(--leaf)}
.btn-xl{font-size:26px;padding:16px 44px}
.btn-gold{background:var(--gold);box-shadow:0 6px 0 var(--gold-d)}
.icon-btn{width:54px;height:54px;border-radius:50%;background:#fff;border:3px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 4px 0 rgba(74,52,40,.12);transition:transform .08s}
.icon-btn:active{transform:translateY(3px)}
.icon-btn svg{width:27px;height:27px}
.bubble{position:relative;background:#fff;border:3px solid var(--line);border-radius:20px;padding:10px 16px;font-size:19px;font-weight:700;line-height:1.5;max-width:300px;box-shadow:0 4px 0 rgba(74,52,40,.08)}
.bubble::before{content:'';position:absolute;bottom:-17px;right:34px;border:9px solid transparent;border-top-color:var(--line)}
.bubble::after{content:'';position:absolute;bottom:-11px;right:37px;border:6px solid transparent;border-top-color:#fff}
.bubble.pop{animation:bubPop .35s cubic-bezier(.34,1.56,.64,1)}
@keyframes bubPop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.lolo{width:150px;flex:none}
.lolo .inner{transform-origin:50% 90%}
.lolo.idle .inner{animation:loIdle 2.4s ease-in-out infinite}
@keyframes loIdle{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.lolo.dance .inner{animation:loDance .5s ease-in-out infinite}
@keyframes loDance{0%,100%{transform:rotate(-7deg) translateY(0)}50%{transform:rotate(7deg) translateY(-10px)}}
.lolo.happy .eye-n{display:none}.lolo.happy .eye-h{display:block}
.lolo:not(.happy) .eye-h{display:none}
.lolo.talk .mouth-s{display:none}.lolo.talk .mouth-o{display:block;animation:flap .18s infinite alternate;transform-origin:110px 108px}
.lolo:not(.talk) .mouth-o{display:none}
@keyframes flap{from{transform:scaleY(.35)}to{transform:scaleY(1)}}
.fly{position:absolute;z-index:2;pointer-events:none;animation:flyP 22s linear infinite}
.fly svg{animation:flt .4s ease-in-out infinite alternate}
@keyframes flt{from{transform:scaleX(1)}to{transform:scaleX(.82)}}
@keyframes flyP{0%{transform:translate(-16vw,20px)}25%{transform:translate(30vw,-30px)}50%{transform:translate(60vw,18px)}75%{transform:translate(90vw,-24px)}100%{transform:translate(116vw,0)}}
#sc-splash{overflow-y:auto;background:linear-gradient(#FFDFEE,#FFF7F9 72%)}
.splash-inner{margin:auto;display:flex;flex-direction:column;align-items:center;text-align:center;padding:34px 20px 44px}
#sc-splash .logo-box{width:170px;height:170px;border-radius:44px;overflow:hidden;box-shadow:0 10px 0 rgba(255,111,165,.35);animation:loIdle 2.5s infinite}
.app-title{font-size:44px;font-weight:800;color:var(--pink);margin-top:20px;line-height:1.1}
.app-sub{font-size:19px;color:var(--ink-soft);font-weight:600;margin-top:2px}
.name-row{margin:22px 0 8px;text-align:center}
.name-row label{display:block;font-size:17px;font-weight:700;color:var(--ink-soft);margin-bottom:8px}
#nameInput{width:240px;text-align:center;font-family:inherit;font-size:26px;font-weight:800;color:var(--ink);background:#fff;border:3px solid var(--line);border-radius:16px;padding:8px 12px;outline:none}
#nameInput:focus{border-color:var(--pink)}
.g-row{display:flex;gap:10px;justify-content:center;margin:14px 0 18px}
.g-pill{border-radius:999px;padding:7px 30px;font-size:19px;font-weight:800;background:#fff;border:3px solid var(--line);color:var(--ink-soft);box-shadow:0 4px 0 rgba(74,52,40,.1)}
.g-pill.on{background:var(--pink);color:#fff;border-color:var(--pink);box-shadow:0 4px 0 var(--pink-d)}
.tiny-note{margin-top:18px;font-size:14px;color:var(--ink-soft);max-width:340px;text-align:center;font-weight:600}
.ver-badge{margin-top:14px;font-size:17px;font-weight:800;color:#B0541E;background:#FFE9BF;border:3px solid var(--gold);border-radius:999px;padding:6px 26px}
#sndStatus{margin-top:10px;font-size:16px;font-weight:800;color:var(--ink-soft);min-height:24px;text-align:center;max-width:340px;line-height:1.8}
#sndStatus .ok{color:#3E8E31}#sndStatus .no{color:#E04E86}
.home-bg{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none}
.map{position:absolute;top:0;left:0;right:0;bottom:0;z-index:2}
.trail{position:absolute;top:0;left:0;right:0;bottom:0;width:100%;height:100%;z-index:1;opacity:.9;pointer-events:none}
.topbar{position:absolute;top:10px;right:12px;left:12px;z-index:5;display:flex;gap:8px;align-items:center;pointer-events:none}
.topbar .icon-btn{pointer-events:auto}
.count-pill{display:flex;align-items:center;gap:6px;background:#fff;border:3px solid var(--line);border-radius:999px;padding:4px 14px 4px 10px;font-weight:800;font-size:20px;box-shadow:0 3px 0 rgba(74,52,40,.1)}
.count-pill svg{width:24px;height:24px}
.spacer{flex:1}
.world{position:absolute;display:flex;flex-direction:column;align-items:center;gap:8px;animation:wIn .5s cubic-bezier(.34,1.56,.64,1) backwards}
.world .disc{width:var(--sz);height:var(--sz);border-radius:50%;background:var(--wc);border:7px solid #fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 0 var(--wd),0 14px 24px rgba(74,52,40,.18);transition:transform .12s}
.world:active .disc,.world.tapped .disc{transform:scale(.92)}
.world .disc .art{width:72%;height:72%;display:flex;align-items:center;justify-content:center}
.world .lbl{background:#fff;border:3px solid var(--line);border-radius:999px;padding:3px 18px;font-weight:800;font-size:19px;box-shadow:0 3px 0 rgba(74,52,40,.1);white-space:nowrap}
@keyframes wIn{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
.home-lolo{position:absolute;bottom:-6px;right:6px;display:flex;align-items:flex-end;gap:4px;z-index:4;animation:wIn .5s .3s backwards;pointer-events:none}
.home-lolo .lolo{width:135px}
.cloud{position:absolute;animation:cD 26s linear infinite}
@keyframes cD{from{transform:translateX(-30vw)}to{transform:translateX(115vw)}}
.simple-head{display:flex;align-items:center;gap:12px;padding:14px 14px 6px}
.simple-head h2{font-size:28px;font-weight:800}
.level-list{flex:1;overflow-y:auto;padding:10px 18px 24px;display:flex;flex-direction:column;gap:16px}
.level-card{position:relative;display:flex;align-items:center;gap:14px;background:#fff;border:4px solid var(--line);border-radius:26px;padding:14px 16px;box-shadow:0 6px 0 rgba(74,52,40,.1);animation:wIn .4s backwards;transition:transform .1s;text-align:right}
.level-card:active{transform:scale(.97)}
.level-card .faces{display:flex;flex-direction:row-reverse}
.level-card .faces .fa{width:70px;height:70px;margin-right:-20px;background:#fff;border-radius:50%;border:4px solid #fff;overflow:hidden;box-shadow:-3px 0 0 rgba(74,52,40,.08);display:flex;align-items:center;justify-content:center}
.level-card .faces .fa:first-child{margin-right:0}
.level-card .faces .fa svg{width:100%;height:100%}
.level-card .faces .fa b{font-size:36px}
.level-card .info h3{font-size:22px;font-weight:800}
.level-card .info p{font-size:15px;color:var(--ink-soft);font-weight:700}
.level-card .st{position:absolute;top:-12px;left:-8px;width:44px;height:44px}
.level-card.locked{filter:grayscale(.7);opacity:.72}
.level-card.locked .lock{width:40px;height:40px;flex:none;margin-right:auto}
.level-card.shake{animation:shk .4s}
@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
.ch-msg{padding:0 24px;font-weight:700;color:var(--ink-soft);min-height:26px;text-align:center}
.play-head{display:flex;align-items:center;gap:10px;padding:12px 14px 4px;z-index:5}
.play-head .spacer{flex:1}
.sess-count{display:flex;align-items:center;gap:6px;background:#fff;border:3px solid var(--line);border-radius:999px;padding:4px 16px;font-weight:800;font-size:22px;box-shadow:0 3px 0 rgba(74,52,40,.1)}
.sess-count.bump{animation:bmp .35s}
@keyframes bmp{50%{transform:scale(1.25)}}
.play-area{position:relative;flex:1;margin:6px 14px 0}
.stage{display:flex;align-items:flex-end;gap:4px;padding:8px 14px 4px;min-height:158px}
.stage .bubble{margin-bottom:6px}
.play-area.locked{pointer-events:none}
.q-row{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;animation:wIn .4s}
.q-title{font-size:24px;font-weight:800;text-align:center;padding:0 10px}
.opts{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;padding:0 8px}
.opt{background:#fff;border:4px solid var(--line);border-radius:24px;width:31%;min-width:92px;max-width:130px;padding:10px;box-shadow:0 6px 0 rgba(74,52,40,.12);transition:transform .1s;transform:rotate(var(--rot,0deg));animation:wIn .45s backwards}
.opt svg{width:100%;height:auto}
.opt.letter b{display:block;font-size:60px;font-weight:800;text-align:center;line-height:1.2}
.opt:active{transform:scale(.93)}
.opt.shake{animation:shk .4s}
.opt.hint{animation:wig .7s infinite}
@keyframes wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.teach-stage{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;animation:wIn .4s}
.big-animal{width:min(56vw,250px);transition:transform .1s;animation:loIdle 2.6s infinite}
.big-animal:active{transform:scale(.94)}
.big-animal.excited{animation:exc .6s}
@keyframes exc{0%,100%{transform:rotate(0) scale(1)}30%{transform:rotate(-8deg) scale(1.08)}60%{transform:rotate(8deg) scale(1.08)}}
.letter-card{background:#fff;border:5px solid var(--line);border-radius:34px;padding:12px 34px;display:flex;flex-direction:column;align-items:center;box-shadow:0 8px 0 rgba(74,52,40,.12);transition:transform .1s}
.letter-card b{font-size:120px;line-height:1.1;font-weight:800}
.letter-card .mini{width:96px;margin-top:4px}
.letter-card.excited{animation:exc .6s}
.teach-tools{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.tool-btn{background:#fff;border:4px solid var(--line);border-radius:20px;padding:8px 20px;font-size:20px;font-weight:800;box-shadow:0 5px 0 rgba(74,52,40,.12);display:flex;align-items:center;gap:8px;transition:transform .1s}
.tool-btn:active{transform:translateY(4px)}
.tool-btn svg{width:24px;height:24px}
.snd-btn{background:var(--gold);border:4px solid var(--gold-d);color:#fff;border-radius:999px;padding:12px 34px;font-size:23px;font-weight:800;box-shadow:0 6px 0 var(--gold-d);display:flex;align-items:center;gap:10px;transition:transform .1s}
.snd-btn:active{transform:translateY(5px)}
.snd-btn svg{width:28px;height:28px}
.miss-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.spot{width:30%;max-width:120px;background:#fff;border:4px solid var(--line);border-radius:24px;padding:8px;position:relative;box-shadow:0 6px 0 rgba(74,52,40,.12);animation:wIn .5s backwards}
.spot svg{width:100%;transition:opacity .4s,transform .4s}
.spot .qmark{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;font-size:60px;font-weight:800;color:var(--pink);opacity:0;transform:scale(.4);transition:all .4s}
.spot.gone svg{opacity:0;transform:scale(.2)}
.spot.gone .qmark{opacity:1;transform:scale(1);animation:bmp 1s infinite}
.blind{position:absolute;top:-6px;left:-20px;right:-20px;bottom:-6px;background:rgba(255,247,249,.97);z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;border-radius:20px}
.blind svg{width:130px}
.blind b{font-size:26px;font-weight:800}
.feed-stage{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
.feed-an{width:120px;animation:loIdle 2s infinite}
.opt.food{width:26%;min-width:88px}
.opt.food svg{width:100%}
.trace-stage{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.trace-board{position:relative;width:min(84%,330px);height:min(84vw,330px);background:#fff;border:5px solid var(--line);border-radius:30px;box-shadow:0 8px 0 rgba(74,52,40,.12);overflow:hidden}
.trace-board .ghost{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;font-size:185px;font-weight:800;opacity:.22}
.trace-board canvas{position:absolute;top:0;left:0;right:0;bottom:0;width:100%;height:100%;touch-action:none}
#sc-rewards{background:#FFDFEE}
.garden-wrap{flex:1;position:relative;overflow:hidden;margin:6px 14px 0;border-radius:26px;border:4px solid #fff;box-shadow:0 6px 0 rgba(74,52,40,.12)}
.garden{position:absolute;top:0;left:0;right:0;bottom:0}
.g-item{position:absolute;animation:wIn .55s cubic-bezier(.34,1.56,.64,1) backwards}
.g-item:active{transform:scale(.94)}
.g-bob{animation:loIdle 2.8s ease-in-out infinite}
#gT{position:absolute;top:12px;right:0;left:0;display:flex;justify-content:center;z-index:20;pointer-events:none}
#gT span{background:#fff;border:3px solid var(--line);border-radius:999px;padding:4px 20px;font-weight:800;font-size:19px;box-shadow:0 4px 0 rgba(74,52,40,.12);opacity:0;transition:opacity .3s}
#gT span.show{opacity:1}
.rw-stats{display:flex;gap:10px;justify-content:center;padding:10px 0 6px}
.rw-stats svg{width:24px;height:24px}
.album{padding:4px 20px 16px;background:var(--paper);border-radius:26px 26px 0 0;margin-top:-14px;position:relative;z-index:3}
.album h3{font-size:22px;font-weight:800;text-align:center;padding:6px}
.album-grid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding-bottom:8px}
.st-slot{width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;transition:transform .1s}
.st-slot.got{background:#fff;border:4px solid var(--gold);box-shadow:0 5px 0 var(--gold-d)}
.st-slot.got:active{transform:scale(.92)}
.st-slot.lock{background:#F6E7EE;border:4px dashed #E3C6D6;color:#C9A9BD;font-size:36px;font-weight:800}
.st-slot svg{width:82%;height:82%}
.st-slot .tag{position:absolute;bottom:-4px;right:0;left:0;text-align:center;font-size:10px;font-weight:700;color:var(--ink-soft)}
#sc-end{align-items:center;justify-content:center;text-align:center;padding:20px;gap:14px;background:linear-gradient(#FFDFEE,#FFF7F9);overflow-y:auto}
#sc-end h2{font-size:40px;color:var(--pink)}
#sc-end .sum{display:flex;flex-direction:column;gap:12px;background:#fff;border:4px solid var(--line);border-radius:26px;padding:18px 24px;box-shadow:0 6px 0 rgba(74,52,40,.1);max-width:340px;width:100%}
.sum-row{display:flex;align-items:center;gap:10px;justify-content:center;font-weight:800;font-size:20px;flex-wrap:wrap}
.sum-row .chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.sum-row .chip{background:#FFEFEE;border:2px solid var(--line);border-radius:12px;padding:2px 12px;font-size:22px;font-weight:800}
.sum-row .chip svg{width:44px;height:44px}
.bye-msg{font-size:26px;font-weight:800}
#praise{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;z-index:70;pointer-events:none}
#praise span{font-size:min(11vw,58px);font-weight:800;color:#fff;opacity:0;text-shadow:0 4px 0 var(--pink),-2px 0 0 var(--pink),2px 0 0 var(--pink),0 -2px 0 var(--pink);-webkit-text-stroke:2px var(--pink)}
#praise span.show{animation:prI 2s cubic-bezier(.34,1.56,.64,1)}
@keyframes prI{0%{opacity:0;transform:scale(.3)}15%{opacity:1;transform:scale(1.15)}30%{transform:scale(1)}85%{opacity:1}100%{opacity:0;transform:scale(1.05)}}
#fx{position:fixed;top:0;left:0;right:0;bottom:0;z-index:80;pointer-events:none}
.modal{position:fixed;top:0;left:0;right:0;bottom:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(74,52,40,.45);padding:18px}
.modal.on{display:flex}
.modal .box{background:var(--paper);border-radius:32px;padding:24px 22px;max-width:400px;width:100%;max-height:88vh;overflow-y:auto;animation:wIn .4s cubic-bezier(.34,1.56,.64,1);text-align:center;box-shadow:0 12px 30px rgba(0,0,0,.25)}
.modal h2{font-size:34px;color:var(--pink);margin-bottom:4px}
.modal .sub{font-size:21px;font-weight:700}
.sticker-card{margin:18px auto;width:190px;height:190px;border-radius:50%;background:#fff;border:6px solid var(--gold);box-shadow:0 8px 0 var(--gold-d);display:flex;align-items:center;justify-content:center;position:relative;animation:wIn .6s .2s backwards}
.sticker-card svg{width:84%;height:84%}
.new-tag{position:absolute;top:-8px;right:-14px;background:var(--pink);color:#fff;font-weight:800;font-size:17px;padding:4px 16px;border-radius:999px;transform:rotate(8deg)}
.modal .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.gate-q{font-size:22px;font-weight:800;margin:14px 0 10px}
.gate-opts{display:flex;gap:12px;justify-content:center}
.gate-opts button{background:#fff;border:4px solid var(--line);border-radius:18px;font-size:26px;font-weight:800;width:74px;height:64px}
.p-sec{margin-top:16px;text-align:right;background:#fff;border:3px solid var(--line);border-radius:20px;padding:14px}
.p-sec h4{font-size:19px;font-weight:800;margin-bottom:8px;color:var(--pink-d)}
.p-grid{display:flex;flex-wrap:wrap;gap:8px}
.p-chip{background:#FFEFEE;border:2px solid var(--line);border-radius:12px;padding:2px 14px;font-weight:800;font-size:20px}
.p-sec ul{padding-right:20px;font-weight:600;font-size:16px;line-height:1.8;color:var(--ink-soft)}
.p-sec input{width:100%;font-family:inherit;font-size:22px;font-weight:800;text-align:center;border:3px solid var(--line);border-radius:14px;padding:6px;outline:none;background:#fff}
.btn-line{background:#fff;color:var(--ink);border:3px solid var(--pink);box-shadow:0 5px 0 var(--pink);font-size:18px;padding:8px 20px}
.btn-danger{background:#E05A3C}

</head>
<body>
<div id="app">
  <div id="jsWarn" style="position:absolute;top:0;left:0;right:0;bottom:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;background:#FFF7F9">
    <div style="font-size:28px;font-weight:800;color:#E04E86">اللعبة مش شغالة</div>
    <div style="font-size:18px;font-weight:700;margin-top:12px">انسخي الكود كله وافتحي المفكرة واحفظيه باسم kenoza.html مع UTF-8 وافتحيه بـ Chrome</div>
  </div>
  <section class="screen on" id="sc-splash">
    <div class="splash-inner">
      <div class="logo-box" id="logoBox"></div>
      <h1 class="app-title">مغامرات كنوزة</h1>
      <p class="app-sub">لعب وحروف وحيوانات لصغارنا</p>
      <div class="name-row">
        <label>اسم البطلة الصغيرة</label>
        <input id="nameInput" maxlength="12" placeholder="كنوزة" autocomplete="off">
        <div class="g-row">
          <button class="g-pill on" data-g="g">بنت</button>
          <button class="g-pill" data-g="b">ولد</button>
        </div>
      </div>
      <button class="btn btn-pink btn-xl" id="btnStart">يلا نلعب!</button>
      <button class="btn btn-gold" id="btnSndTest" style="margin-top:14px;font-size:20px;padding:12px 30px">شغّلي صوت الحيوانات</button>
      <div id="sndStatus"></div>
      <p class="ver-badge">مغامرات كنوزة</p>
    </div>
  </section>
  <section class="screen" id="sc-home">
    <div class="home-bg" id="homeBg"></div>
    <header class="topbar">
      <div class="count-pill" id="homeStars"></div>
      <div class="count-pill" id="homeStk"></div>
      <div class="spacer"></div>
      <button class="icon-btn" id="btnSound"></button>
      <button class="icon-btn" id="btnParents"></button>
    </header>
    <div class="map" id="homeMap"></div>
    <div class="home-lolo">
      <div class="bubble" id="homeBubble"></div>
      <div class="lolo idle" id="loloHome"></div>
    </div>
  </section>
  <section class="screen" id="sc-choose">
    <header class="simple-head">
      <button class="icon-btn" id="chBack"></button>
      <h2 id="chTitle"></h2>
    </header>
    <div class="ch-msg" id="chMsg"></div>
    <div class="level-list" id="levelList"></div>
  </section>
  <section class="screen" id="sc-play">
    <header class="play-head">
      <button class="icon-btn" id="btnBack"></button>
      <div class="spacer"></div>
      <div class="sess-count" id="sessCount"></div>
      <div class="spacer"></div>
      <button class="icon-btn" id="btnRepeat"></button>
    </header>
    <main class="play-area" id="playArea"></main>
    <div class="stage">
      <div class="bubble" id="playBubble"></div>
      <div class="lolo idle" id="loloPlay"></div>
    </div>
  </section>
  <section class="screen" id="sc-rewards">
    <header class="simple-head">
      <button class="icon-btn" id="rwBack"></button>
      <h2>عالم كنوزة</h2>
    </header>
    <div class="garden-wrap">
      <div id="gT"><span></span></div>
      <div class="garden" id="garden"></div>
    </div>
    <div class="rw-stats" id="rwStats"></div>
    <div class="album">
      <h3>ألبوم الستيكرز</h3>
      <div class="album-grid" id="albumGrid"></div>
    </div>
  </section>
  <section class="screen" id="sc-end">
    <div class="lolo idle" id="loloEnd" style="width:140px"></div>
    <h2 id="endTitle"></h2>
    <div class="sum" id="endSum"></div>
    <p class="bye-msg" id="endBye"></p>
    <button class="btn btn-lilac btn-xl" id="btnEndHome">نرجع للبيت</button>
  </section>
</div>
<canvas id="fx"></canvas>
<div id="praise"><span id="praiseTxt"></span></div>
<div class="modal" id="mLevel">
  <div class="box">
    <h2 id="mlTitle"></h2>
    <p class="sub" id="mlSub"></p>
    <div id="mlSticker"></div>
    <div class="row">
      <button class="btn btn-lilac" id="btnLvHome">نرجع للبيت</button>
      <button class="btn btn-pink" id="btnLvNext">المرحلة اللي بعدها</button>
      <button class="btn btn-leaf" id="btnLvWorld">شوفي عالم كنوزة</button>
    </div>
  </div>
</div>
<div class="modal" id="mParent">
  <div class="box">
    <h2 style="margin-bottom:8px">منطقة الوالدين</h2>
    <div id="gateView">
      <p class="sub">جاوبي: </p>
      <p class="gate-q" id="gateQ"></p>
      <div class="gate-opts" id="gateOpts"></div>
    </div>
    <div id="parentView" style="display:none;text-align:right">
      <div id="pTime" style="font-size:22px;font-weight:800;text-align:center;margin:6px 0"></div>
      <div class="p-sec"><h4>الحروف اللي اتعلمت</h4><div class="p-grid" id="pLetters"></div></div>
      <div class="p-sec"><h4>الحيوانات اللي اتعرّفت</h4><div class="p-grid" id="pAnimals"></div></div>
      <div class="p-sec"><h4>اسم الطفل</h4>
        <input id="pName" maxlength="12"><div class="row"><button class="btn btn-line" id="pSaveName">احفظ الاسم</button></div>
      </div>
      <div class="p-sec"><h4>بدء من جديد</h4>
        <div class="row"><button class="btn btn-danger" id="pReset">امسح كل التقدم</button></div>
      </div>
    </div>
    <div class="row"><button class="btn btn-line" id="pClose">اقفل</button></div>
  </div>
</div>
